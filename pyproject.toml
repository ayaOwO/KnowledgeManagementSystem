[project]
name = "KnowledgeSystem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aya Kraise", email = "ayakraise@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.141.1",
    "logfire>=5.1.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.51.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
KnowledgeSystem = "KnowledgeSystem.main:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "knowledgesystem.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
