<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge System</title>
<style>
  body { font: 1rem system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: grid; gap: .7rem; margin-bottom: 2rem; }
  label { display: grid; gap: .2rem; }
  fieldset { display: grid; gap: .7rem; }
  input, select, textarea, button { font: inherit; padding: .5rem; }
  button { cursor: pointer; }
  article { border-top: 1px solid #ccc; padding: 1rem 0; }
  article h3 { margin: 0 0 .3rem; }
  article img { display: block; max-width: 100%; max-height: 20rem; margin: .7rem 0; }
  .document-content { white-space: pre-wrap; overflow-wrap: anywhere; }
  #message { min-height: 1.5rem; }
  [hidden] { display: none; }
</style>
<h1>Knowledge System</h1>
<h2>Add document</h2>
<form id="add-form">
  <label>Name <input name="name" required></label>
  <label>Type <select name="type"><option value="image">Image</option><option value="text">Text</option></select></label>
  <fieldset>
    <legend>Contents</legend>
    <label id="image-field">Image <input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label>
    <label id="text-field" hidden>Text <textarea name="contents"></textarea></label>
  </fieldset>
  <button>Add document</button>
</form>
<h2>Documents</h2>
<form id="search-form">
  <label>smart search<input name="term" type="search"></label>
  <button>Search</button>
  <button type="button" id="list-all">List all</button>
</form>
<p id="message" role="status"></p>
<div id="results"></div>
<script>
  const message = document.querySelector('#message');
  const results = document.querySelector('#results');

  async function request(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) throw new Error(`Request failed (${response.status})`);
    return response.json();
  }

  async function showDocuments(term = '') {
    const documents = await request(term ? `/search?term=${encodeURIComponent(term)}` : '/list');
    results.replaceChildren();
    for (const item of documents) {
      const article = document.createElement('article');
      const title = document.createElement('h3');
      const description = document.createElement('p');
      const tags = document.createElement('p');
      const deleteButton = document.createElement('button');
      title.textContent = item.name;
      description.textContent = `Description: ${item.description}`;
      tags.textContent = `Tags: ${item.tags.join(', ')}`;
      deleteButton.type = 'button';
      deleteButton.textContent = 'Delete';
      deleteButton.setAttribute('aria-label', `Delete ${item.name}`);
      deleteButton.addEventListener('click', async () => {
        if (!confirm(`Delete ${item.name}?`)) return;
        try {
          const response = await fetch(`/delete?document_id=${encodeURIComponent(item.id)}`);
          if (!response.ok) throw new Error(`Delete failed (${response.status})`);
          await showDocuments(term);
        } catch (error) { message.textContent = error.message; }
      });
      article.append(title);
      const base64 = item.content.replace(/-/g, '+').replace(/_/g, '/');
      if (['image/jpeg', 'image/png', 'image/webp'].includes(item.content_type)) {
        const image = document.createElement('img');
        image.src = `data:${item.content_type};base64,${base64}`;
        image.alt = item.description || item.name;
        image.loading = 'lazy';
        article.append(image);
      } else if (item.content_type === 'text/plain') {
        const content = document.createElement('p');
        content.className = 'document-content';
        content.textContent = new TextDecoder().decode(Uint8Array.from(atob(base64), char => char.charCodeAt(0)));
        article.append(content);
      }
      article.append(description, tags, deleteButton);
      results.append(article);
    }
    message.textContent = `${documents.length} document(s)`;
  }

  document.querySelector('#search-form').addEventListener('submit', async event => {
    event.preventDefault();
    try { await showDocuments(new FormData(event.currentTarget).get('term').trim()); }
    catch (error) { message.textContent = error.message; }
  });

  document.querySelector('#list-all').addEventListener('click', async () => {
    document.querySelector('#search-form').reset();
    try { await showDocuments(); }
    catch (error) { message.textContent = error.message; }
  });

  const addForm = document.querySelector('#add-form');
  addForm.elements.type.addEventListener('change', () => {
    const isImage = addForm.elements.type.value === 'image';
    document.querySelector('#image-field').hidden = !isImage;
    document.querySelector('#text-field').hidden = isImage;
    addForm.elements.image.required = isImage;
    addForm.elements.contents.required = !isImage;
  });

  addForm.addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.currentTarget;
    try {
      const data = new FormData();
      data.set('name', form.elements.name.value);
      if (form.elements.type.value === 'image') {
        data.set('file_upload', form.elements.image.files[0]);
      } else {
        data.set('file_upload', new File([form.elements.contents.value], 'contents.txt', { type: 'text/plain' }));
      }
      const response = await fetch('/upload', { method: 'POST', body: data });
      if (!response.ok) throw new Error(`Upload failed (${response.status})`);
      form.reset();
      form.elements.type.dispatchEvent(new Event('change'));
      document.querySelector('#search-form').reset();
      await showDocuments();
    } catch (error) { message.textContent = error.message; }
  });

  showDocuments().catch(error => { message.textContent = error.message; });
</script>
</html>
